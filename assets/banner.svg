<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" role="img" aria-label="Hot Path Heatmap - spot the expensive call before production">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EE9068"/>
      <stop offset="1" stop-color="#C4532E"/>
    </linearGradient>
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3E9E90"/>
      <stop offset="0.28" stop-color="#2C86B8"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="0.72" stop-color="#7C5CEC"/>
      <stop offset="1" stop-color="#C24DD6"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="878" height="178" rx="20" fill="#1B2028" stroke="#2A313B" stroke-width="1.5"/>
  <rect x="28" y="34" width="112" height="112" rx="24" fill="url(#tile)"/>
  <!-- mark: three heat bars rising (cheap to hot) -->
  <rect x="50" y="100" width="22" height="30" rx="6" fill="#FDEDE5" opacity="0.55"/>
  <rect x="79" y="82" width="22" height="48" rx="6" fill="#FDEDE5" opacity="0.78"/>
  <rect x="108" y="60" width="22" height="70" rx="6" fill="#FDEDE5"/>
  <text x="176" y="82" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="41" font-weight="700" fill="#E77B52">Hot Path Heatmap</text>
  <text x="178" y="118" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#98A0AD">Spot the expensive call before production does.</text>
  <rect x="178" y="138" width="300" height="6" rx="3" fill="url(#ramp)"/>
</svg>
