name: Bug report
description: Something broke — an error, a crash, highlighting not appearing, settings not working.
labels: [bug]
body:
  - type: input
    id: ide
    attributes:
      label: IDE and version
      description: e.g. PhpStorm 2025.3.2, IntelliJ IDEA Ultimate 2026.1
      placeholder: PhpStorm 2025.3
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Settings → Plugins → Hot Path Heatmap
      placeholder: 0.6.1
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language of the file involved
      options:
        - PHP
        - JavaScript / TypeScript
        - Java
        - Kotlin
        - Groovy
        - Scala
        - Not language-specific
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Include the exact error text if there is one (Help → Show Log in Finder/Explorer for idea.log).
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Minimal code snippet (if relevant)
      description: A small piece of code that reproduces the problem. Strip anything confidential — the analysis is fully local, and so should be your report.
      render: text
